<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Giới Thiệu Cá Nhân & Sản Phẩm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            padding: 30px 15px; 
            line-height: 1.6;
        } 
        
        /* Profile Section */
        .profile-card {
            background-color: #ffffff;
            max-width: 900px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .profile-card h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .profile-card p {
            color: #555;
            font-size: 16px;
        }

        /* Products Section */
        .section-title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .media-container { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        } 
        .media-card { 
            background-color: #ffffff; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: space-between; 
            padding: 15px;
            height: 420px;
        } 
        .media-card h3 {
            font-size: 16px;
            color: #34495e;
            margin-bottom: 10px;
        }
        .media-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
        } 
        .media-card iframe, .media-card object { 
            width: 100%; 
            height: 100%; 
            border: 0; 
            border-radius: 5px;
        } 
        .pdf-fallback {
            margin-top: 8px;
            font-size: 13px;
            color: #2980b9;
            text-decoration: none;
        }
        .pdf-fallback:hover {
            text-decoration: underline;
        }

        footer { 
            margin-top: 40px; 
            text-align: center;
            font-size: 13px; 
            color: #7f8c8d; 
        }
    </style>
</head>
<body>

    <!-- Khối Giới Thiệu Cá Nhân -->
    <header class="profile-card">
        <h1>Xin chào, tôi là [Tên Của Bạn]</h1>
        <p>Chào mừng bạn đến với trang giới thiệu cá nhân và tổng hợp các sản phẩm đã hoàn thành.</p>
    </header>

    <h2 class="section-title">Danh Sách Sản Phẩm</h2>

    <!-- Khối Hiển Thị 3 Sản Phẩm -->
    <main class="media-container">
        
        <!-- Sản phẩm 1: File Ảnh PNG -->
        <div class="media-card">
            <h3>1. Hình ảnh Infographic (PNG)</h3>
            <img src="/Lab05_Ex2.1.PNG" alt="Sản phẩm PNG">
        </div>

        <!-- Sản phẩm 2: File Tài Liệu PDF -->
        <div class="media-card">
            <h3>2. Tài liệu báo cáo (PDF)</h3>
            <object data="/Lab05_Ex1.2.pdf" type="application/pdf" width="100%" height="100%">
                <p>Trình duyệt không hỗ trợ xem trực tiếp PDF. <a class="pdf-fallback" href="/Lab05_Ex1.2.pdf" target="_blank">Nhấn vào đây để tải/xem PDF</a></p>
            </object>
        </div>

        <!-- Sản phẩm 3: Video YouTube -->
        <div class="media-card">
            <h3>3. Video Bài Giảng (YouTube)</h3>
            <iframe 
                src="https://www.youtube.com/embed/HBnCsZ__6Zs" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

    </main>

    <footer>
        <p>© Trang web được lưu trữ và vận hành trên GitHub Pages.</p>
    </footer>

</body>
</html>
