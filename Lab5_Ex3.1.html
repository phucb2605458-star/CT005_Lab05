<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Exercise 3.1</title>
    <!-- THẺ STYLE PHẢI NẰM BÊN TRONG THẺ HEAD -->
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 30px 15px; 
            text-align: center; 
        } 
        header { 
            max-width: 900px; 
            margin: 0 auto 30px auto; 
        } 
        h1 { 
            color: #2c3e50; 
            font-size: 28px; 
            margin-bottom: 10px; 
        } 
        .description { 
            font-size: 16px; 
            color: #555; 
            margin-bottom: 8px; 
        } 
        .copyright-note { 
            font-size: 14px; 
            color: #16a085; 
            font-weight: 500; 
        } 
        .media-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 25px; 
            max-width: 1100px; 
            margin: 0 auto; 
            flex-wrap: wrap; 
        } 
        .media-card { 
            background-color: #ffffff; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            overflow: hidden; 
            flex: 1; 
            min-width: 320px; 
            max-width: 520px; 
            height: 300px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        } 
        .media-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
            background-color: #fff; 
        } 
        .media-card iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
        } 
        footer { 
            margin-top: 40px; 
            font-size: 13px; 
            color: #7f8c8d; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Ứng dụng AI trong học tập & Công nghệ</h1>
        <p class="description">Tổng hợp infographic thông tin công nghệ số và video bài giảng liên quan.</p>
        <p class="copyright-note">Infographic tạo bởi Canva AI, hình ảnh từ Unsplash (Unsplash license).</p>
    </header>

    <main class="media-container">
        <!-- Khung Infographic -->
        <div class="media-card">
            <img src="../lab05/Lab05_Ex2.1.PNG" alt="Infographic Canva AI">
        </div>

        <!-- Khung Video YouTube (Đã thêm referrerpolicy để fix lỗi 153) -->
        <div class="media-card">
            <iframe 
                src="https://youtu.be/HBnCsZ__6Zs" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>
    </main>

    <footer>
        <p>Ghi chú: Mã nguồn HTML này được tạo và hỗ trợ bởi GitHub Copilot.</p>
    </footer>

</body>
</html>
